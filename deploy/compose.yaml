name: fish-free-mcp
services:
  app:
    build: ..
    image: fish-free-mcp:review
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 150s
    init: true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,uid=10001,gid=10001,mode=700"]
    volumes: [state:/data]
    secrets: [fish_api_key,auth_secret,bootstrap_secret]
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set an approved stable HTTPS origin}
      OWNER_EMAIL: ${OWNER_EMAIL:?Set the owner's email}
      FREE_VERIFIED_UNTIL: "2026-11-30T23:59:59Z"
    networks: [private]
    depends_on: [egress]
    logging: {driver: json-file, options: {max-size: 5m, max-file: "3"}}
  egress:
    build: ./egress
    image: fish-free-egress:review
    user: "13:13"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    init: true
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,uid=13,gid=13,mode=700"]
    networks: [private,outbound]
    logging: {driver: json-file, options: {max-size: 1m, max-file: "2"}}
  tunnel:
    image: cloudflare/cloudflared:2026.11.1@sha256:e613aadbc2d9511785d2e67a86b0c8ac18dd63a3f9af0d06faf04cbfdcb35f2d
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    command: [tunnel,--no-autoupdate,run,--token-file,/run/secrets/tunnel_token]
    secrets: [tunnel_token]
    networks: [private,outbound]
    depends_on:
      app: {condition: service_healthy}
    logging: {driver: json-file, options: {max-size: 2m, max-file: "2"}}
networks:
  private: {internal: true}
  outbound: {}
volumes:
  state: {}
secrets:
  fish_api_key: {file: ./secrets/fish_api_key}
  auth_secret: {file: ./secrets/auth_secret}
  bootstrap_secret: {file: ./secrets/bootstrap_secret}
  tunnel_token: {file: ./secrets/tunnel_token}
